<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOLEM · Joyas en Plata 925 · Córdoba</title>
    <meta name="description" content="Piezas únicas en plata 925, diseñadas y creadas a mano en Córdoba. Anillos, cadenas, pulseras, dijes y más. Pedidos por WhatsApp." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#F5F0E8" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="SOLEM · Joyas en Plata 925" />
    <meta property="og:description" content="Piezas únicas en plata 925 hechas a mano en Córdoba. Pedidos por WhatsApp." />
    <meta property="og:site_name" content="SOLEM Joyas" />

    <!-- Preconnect para Firebase (mejora TTFB) -->
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://storage.googleapis.com" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet" />

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

    <!-- Eager Pre-fetch de Productos y Contenido (0ms delay) -->
    <script>
      (function() {
        var projectId = "%VITE_FIREBASE_PROJECT_ID%";
        if (!projectId || projectId.indexOf('%') === 0) {
          return;
        }

        function preloadImage(url) {
          if (!url || typeof url !== 'string') return;
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = url;
          document.head.appendChild(link);
        }

        function parseVal(v) {
          if (!v) return null;
          if ('stringValue' in v) return v.stringValue;
          if ('integerValue' in v) return parseInt(v.integerValue, 10);
          if ('doubleValue' in v) return parseFloat(v.doubleValue);
          if ('booleanValue' in v) return v.booleanValue;
          if ('arrayValue' in v) {
            var arr = v.arrayValue.values || [];
            return arr.map(parseVal);
          }
          if ('mapValue' in v) {
            var fields = v.mapValue.fields || {};
            var obj = {};
            for (var k in fields) {
              obj[k] = parseVal(fields[k]);
            }
            return obj;
          }
          return null;
        }

        function parseDoc(doc) {
          var fields = doc.fields || {};
          var obj = { id: doc.name.split('/').pop() };
          for (var k in fields) {
            obj[k] = parseVal(fields[k]);
          }
          return obj;
        }

        try {
          var productsUrl = "https://firestore.googleapis.com/v1/projects/" + projectId + "/databases/(default)/documents:runQuery";
          fetch(productsUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              structuredQuery: {
                from: [{ collectionId: 'products' }],
                where: { fieldFilter: { field: { fieldPath: 'active' }, op: 'EQUAL', value: { booleanValue: true } } },
                limit: 20
              }
            })
          })
            .then(function(res) { return res.json(); })
            .then(function(data) {
              if (data && Array.isArray(data)) {
                var parsedProducts = [];
                data.forEach(function(item) {
                  if (item && item.document) {
                    parsedProducts.push(parseDoc(item.document));
                  }
                });
                if (parsedProducts.length > 0) {
                  localStorage.setItem('solem_products_cache', JSON.stringify(parsedProducts));
                  window.dispatchEvent(new CustomEvent('solem_products_updated', { detail: parsedProducts }));
                  // Preload first 4 product images so they appear instantly
                  parsedProducts.slice(0, 4).forEach(function(p) {
                    var imgs = p.images && p.images.length > 0 ? p.images : [p.image];
                    preloadImage(imgs[0]);
                  });
                }
              }
            })
            .catch(function(err) { console.warn('Eager products fetch failed:', err); });

          var homeUrl = "https://firestore.googleapis.com/v1/projects/" + projectId + "/databases/(default)/documents/settings/homeContent";
          fetch(homeUrl)
            .then(function(res) { return res.json(); })
            .then(function(data) {
              if (data && data.fields) {
                var parsedHome = parseDoc(data);
                localStorage.setItem('solem_home_cache', JSON.stringify(parsedHome));
                window.dispatchEvent(new CustomEvent('solem_home_updated', { detail: parsedHome }));
                // Preload hero image immediately
                if (parsedHome.heroImage) preloadImage(parsedHome.heroImage);
              }
            })
            .catch(function(err) { console.warn('Eager homeContent fetch failed:', err); });
        } catch (e) {
          console.error('Error en eager prefetch:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
